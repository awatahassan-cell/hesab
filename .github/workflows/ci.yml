name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

      # Catches an import that resolves under tsc but breaks the bundler,
      # which a typecheck alone will not find.
      - name: Bundle for web
        run: npx expo export --platform web --output-dir /tmp/web-build
